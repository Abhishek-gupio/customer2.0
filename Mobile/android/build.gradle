buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.1")
    }
}

apply plugin: "com.facebook.react.rootproject"

def forcedOkHttpVersion = "4.12.0"
def forcedOkioVersion = "3.6.0"

// Ensure all modules (including AsyncStorage) can resolve Maven artifacts.
allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
// Avoid duplicate classes: exclude old support libs (AndroidX is used)
gradle.projectsLoaded {
    rootProject.subprojects { subproject ->
        subproject.configurations.configureEach { config ->
            config.exclude group: "com.android.support", module: "support-compat"
            config.exclude group: "com.android.support", module: "support-v4"
            config.exclude group: "com.android.support", module: "versionedparcelable"
            config.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "com.squareup.okhttp3" &&
                    ["okhttp", "okhttp-urlconnection", "logging-interceptor", "mockwebserver"].contains(details.requested.name)) {
                    details.useVersion(forcedOkHttpVersion)
                    details.because("Keep OkHttp modules on one version to avoid runtime NoClassDefFoundError in JavaNetCookieJar")
                }

                if (details.requested.group == "com.squareup.okio" &&
                    ["okio", "okio-jvm"].contains(details.requested.name)) {
                    details.useVersion(forcedOkioVersion)
                    details.because("Keep Okio aligned with the forced OkHttp runtime")
                }
            }
            config.resolutionStrategy.force(
                "com.squareup.okhttp3:okhttp:${forcedOkHttpVersion}",
                "com.squareup.okhttp3:okhttp-urlconnection:${forcedOkHttpVersion}",
                "com.squareup.okhttp3:logging-interceptor:${forcedOkHttpVersion}",
                "com.squareup.okhttp3:mockwebserver:${forcedOkHttpVersion}",
                "com.squareup.okio:okio:${forcedOkioVersion}",
                "com.squareup.okio:okio-jvm:${forcedOkioVersion}"
            )
        }
    }
}

// Some third-party RN Android libraries (for example older Firebase wrappers)
// may omit compileSdk; force a safe default from root ext to keep AGP happy.
def ensureCompileSdk = { proj ->
    def androidExt = proj.extensions.findByName("android")
    if (androidExt == null) return
    def sdk = (rootProject.ext.compileSdkVersion as Integer)
    try {
        if (!androidExt.compileSdk || (androidExt.compileSdk as Integer) == 0) {
            androidExt.compileSdk = sdk
        }
    } catch (ignored) {
        try {
            androidExt.compileSdkVersion sdk
        } catch (ignoredToo) {
            // no-op for non-Android modules
        }
    }
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.application") {
        ensureCompileSdk(subproject)
    }
    subproject.plugins.withId("com.android.library") {
        ensureCompileSdk(subproject)
    }
}
