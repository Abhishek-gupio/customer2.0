buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.1")
        classpath("expo.modules:expo-modules-gradle-plugin:55.0.13")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }
}

// Avoid duplicate classes: exclude old support libs (AndroidX is used)
gradle.projectsLoaded {
    rootProject.subprojects { subproject ->
        subproject.configurations.configureEach { config ->
            config.exclude group: "com.android.support", module: "support-compat"
            config.exclude group: "com.android.support", module: "support-v4"
            config.exclude group: "com.android.support", module: "versionedparcelable"
        }
        
        // Force subprojects to use the same SDK versions as the root project
        if (subproject.hasProperty('android')) {
            subproject.android {
                if (namespace == null) {
                    namespace subproject.group
                }
                compileSdk rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
                defaultConfig {
                    minSdk rootProject.ext.minSdkVersion
                    targetSdk rootProject.ext.targetSdkVersion
                }
            }
        }
    }
}