buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // Required for react-native-background-geolocation
        maven { url "https://maven.transistorsoft.com/releases" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.android.tools.build:gradle:8.0.2")  // (version may vary)
        classpath("com.google.gms:google-services:4.4.0")  // 👈 add this line
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Required for react-native-background-geolocation
        // Library bundles dependency locally, but Gradle still tries remote first
        // Add local libs repository (library's own build.gradle also has this)
        maven { url "${rootDir}/../node_modules/react-native-background-geolocation/android/libs" }
        // Remote repository (may fail if network/DNS is unavailable)
        maven { url "https://maven.transistorsoft.com/releases" }
    }
}
