apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

def hasGoogleServicesConfig =
    file("google-services.json").exists() ||
    file("src/debug/google-services.json").exists() ||
    file("src/release/google-services.json").exists()

if (hasGoogleServicesConfig) {
    apply plugin: "com.google.gms.google-services" // Required for Firebase Cloud Messaging
} else {
    logger.lifecycle("google-services.json not found; skipping Google Services plugin for local build")
}
// Disabled: Google Services plugin requires google-services.json which is not configured
// apply plugin: "com.google.gms.google-services" // Required for Firebase Cloud Messaging

// Copy react-native-vector-icons font files into the app so icons display.
// Support both local node_modules and hoisted workspace installs.
def vectorIconsFontsGradle = file("../../node_modules/react-native-vector-icons/fonts.gradle")
if (!vectorIconsFontsGradle.exists()) {
    vectorIconsFontsGradle = file("../../../node_modules/react-native-vector-icons/fonts.gradle")
}
if (vectorIconsFontsGradle.exists()) {
    apply from: vectorIconsFontsGradle
} else {
    logger.lifecycle("react-native-vector-icons/fonts.gradle not found; skipping font copy script")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../..")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = file("../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   Use hermes-compiler from workspace root (pnpm hoists it there; plugin substitutes %OS-BIN%)
    hermesCommand = "${project.rootProject.projectDir.parentFile.parentFile}/node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    configurations.all {
        exclude group: 'com.android.support'
    }
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = "com.mobile1"
    defaultConfig {
        applicationId "com.mobile1"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'META-INF/DEPENDENCIES'
        pickFirst 'META-INF/INDEX.LIST'
        pickFirst 'META-INF/io.netty.versions.properties'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
    }
}

repositories {
    maven { url "https://s3.us-east-2.amazonaws.com/android.telematics.sdk.production/" }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.fresco:animated-gif:3.6.0")
    // Damoov Telematics SDK – trip recording and upload to Datahub
    implementation("com.telematicssdk:tracking:3.2.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-share')

    // Firebase BoM and Analytics (Step 3)
    implementation(platform("com.google.firebase:firebase-bom:34.11.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")

    // Jetpack Compose Dependencies (Required for DotLottie)
    def compose_version = "1.7.5"
    implementation("androidx.compose.runtime:runtime:$compose_version")
    implementation("androidx.compose.ui:ui:$compose_version")
    implementation("androidx.compose.foundation:foundation:$compose_version")
    implementation("androidx.compose.material:material:$compose_version")
}

// Fix: React Native's generateReactNativeEntryPoint uses default "com.mobile". We use com.mobile1.
// Patch the generated file before every Java compile so it always has the correct package.
def entryPointFile = file("${buildDir}/generated/autolinking/src/main/java/com/facebook/react/ReactNativeApplicationEntryPoint.java")
def autolinkingCmakeFile = file("${buildDir}/generated/autolinking/src/main/jni/Android-autolinking.cmake")
def autolinkingCppFile = file("${buildDir}/generated/autolinking/src/main/jni/autolinking.cpp")
def autolinkingStubCppFile = file("${buildDir}/generated/autolinking/src/main/jni/autolink_stub.cpp")

tasks.register("patchEntryPointPackage") {
    doLast {
        if (entryPointFile.exists()) {
            entryPointFile.text = entryPointFile.text.replace("com.mobile.", "com.mobile1.")
        }
    }
}

tasks.register("patchAutolinkingCmake") {
    doLast {
        if (!autolinkingCmakeFile.exists()) {
            return
        }

        if (!autolinkingStubCppFile.parentFile.exists()) {
            autolinkingStubCppFile.parentFile.mkdirs()
        }
        if (!autolinkingStubCppFile.exists()) {
            autolinkingStubCppFile.text = "void react_native_autolink_stub() {}\n"
        }

        Set<String> skippedLibraries = new LinkedHashSet<>()
        def patchedLines = []
        def inAutolinkedLibraries = false

        autolinkingCmakeFile.eachLine { line ->
            def matcher = (line =~ /^add_subdirectory\("([^"]+)"\s+([^)]+)\)$/)
            if (matcher.matches()) {
                def sourceDir = matcher[0][1]
                def buildTarget = matcher[0][2]
                def codegenLibrary = ("react_codegen_" + buildTarget.replace("_autolinked_build", "")).toString()

                if (file(sourceDir).exists()) {
                    patchedLines << line
                } else {
                    skippedLibraries << codegenLibrary
                    patchedLines << "message(STATUS \"Skipping missing autolinked JNI dir: ${sourceDir}\")"
                }
                return
            }

            if (line.trim() == "set(AUTOLINKED_LIBRARIES") {
                inAutolinkedLibraries = true
                patchedLines << line
                return
            }

            if (inAutolinkedLibraries) {
                if (line.trim() == ")") {
                    inAutolinkedLibraries = false
                    patchedLines << line
                    return
                }

                def libName = line.trim().toString()
                if (!libName || !skippedLibraries.contains(libName)) {
                    patchedLines << line
                }
                return
            }

            patchedLines << line
        }

        def placeholderLines = skippedLibraries.collect { "add_library(${it} STATIC \"${autolinkingStubCppFile.absolutePath.replace('\\', '/')}\")" }
        def insertionIndex = patchedLines.findIndexOf { it.trim() == 'set(REACTNATIVE_MERGED_SO true)' }
        if (insertionIndex >= 0 && !placeholderLines.isEmpty()) {
            patchedLines.addAll(insertionIndex + 1, [''] + placeholderLines + [''])
        }

        autolinkingCmakeFile.text = patchedLines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register("patchAutolinkingCpp") {
    doLast {
        if (!autolinkingCppFile.exists()) {
            return
        }

        def repoRoot = project.rootProject.projectDir.parentFile.parentFile
        Set<String> missingModuleHeaders = new LinkedHashSet<>()
        def keepLine = { line ->
            def moduleIncludeMatcher = (line =~ /^#include <([A-Za-z0-9_]+)\.h>$/)
            if (!moduleIncludeMatcher.matches()) {
                return true
            }

            def headerName = "${moduleIncludeMatcher[0][1]}.h"
            def matches = fileTree(dir: repoRoot, includes: ["node_modules/**/${headerName}"]).files
            if (!matches.isEmpty()) {
                return true
            }

            missingModuleHeaders << moduleIncludeMatcher[0][1].toString()
            return false
        }

        def patchedLines = []
        def skipModuleBlock = false
        def skipComponentBlock = false

        autolinkingCppFile.eachLine { line ->
            if (!keepLine(line)) {
                return
            }

            def moduleProviderMatcher = (line =~ /^\s*auto module_([A-Za-z0-9_]+) = ([A-Za-z0-9_]+)_ModuleProvider\(moduleName, params\);$/)
            if (moduleProviderMatcher.matches() && missingModuleHeaders.contains(moduleProviderMatcher[0][2].toString())) {
                skipModuleBlock = true
                return
            }

            if (skipModuleBlock) {
                if (line.trim() == "}") {
                    skipModuleBlock = false
                }
                return
            }

            def componentMatcher = (line =~ /^\s*providerRegistry->add\(concreteComponentDescriptorProvider<([A-Za-z0-9_]+)>\(\)\);$/)
            if (componentMatcher.matches()) {
                def descriptorName = componentMatcher[0][1].toString()
                def headerName = "${descriptorName}.h"
                def matches = fileTree(dir: repoRoot, includes: ["node_modules/**/${headerName}"]).files
                if (matches.isEmpty()) {
                    return
                }
            }

            patchedLines << line
        }

        autolinkingCppFile.text = patchedLines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.configureEach { task ->
    if (task.name == "compileDebugJavaWithJavac" || task.name == "compileReleaseJavaWithJavac") {
        task.dependsOn("patchEntryPointPackage")
    }
    if (task.name.startsWith("externalNativeBuild") || task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.dependsOn("patchAutolinkingCmake")
        task.dependsOn("patchAutolinkingCpp")
    }
}

