pluginManagement {
    def mobilePluginDir = new File(rootDir, "../node_modules/@react-native/gradle-plugin")
    def workspacePluginDir = new File(rootDir, "../../node_modules/@react-native/gradle-plugin")
    includeBuild((mobilePluginDir.exists() ? mobilePluginDir : workspacePluginDir).path)
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins { id("com.facebook.react.settings") }

def mobileNodeModulesDir = new File(rootDir, "../node_modules")
def workspaceNodeModulesDir = new File(rootDir, "../../node_modules")

def resolveFromNodeModules = { String relativePath ->
    def mobileCandidate = new File(mobileNodeModulesDir, relativePath)
    if (mobileCandidate.exists()) return mobileCandidate

    def workspaceCandidate = new File(workspaceNodeModulesDir, relativePath)
    if (workspaceCandidate.exists()) return workspaceCandidate

    return mobileCandidate
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'Mobile'
include ':app'

def pnpmRoot = new File(mobileNodeModulesDir, '.pnpm')
if (pnpmRoot.exists()) {
    pnpmRoot.eachDir { d ->
        def candidate = new File(d, 'node_modules/react-native-nitro-modules')
        if (candidate.exists()) {
            includeBuild(candidate)
            println "Included react-native-nitro-modules from ${candidate}"
            return
        }
    }
}

includeBuild(resolveFromNodeModules("@react-native/gradle-plugin").path)

def reactNativeShareDir = resolveFromNodeModules('react-native-share/android')

include ':react-native-share'
project(':react-native-share').projectDir = reactNativeShareDir
