pluginManagement {
    includeBuild("../../node_modules/@react-native/gradle-plugin")
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'Mobile'
include ':app'

def pnpmRoot = new File(rootDir, 'node_modules/.pnpm')
if (pnpmRoot.exists()) {
    pnpmRoot.eachDir { d ->
        def candidate = new File(d, 'node_modules/react-native-nitro-modules')
        if (candidate.exists()) {
            includeBuild(candidate)
            println "Included react-native-nitro-modules from ${candidate}"
            return
        }
    }
}

includeBuild('../../node_modules/@react-native/gradle-plugin')

def findExpoDir = { ->
    def localNodeModules = new File(rootDir, 'node_modules')
    def workspaceNodeModules = new File(rootDir, '../node_modules')
    def nodeModuleDirs = [localNodeModules, workspaceNodeModules]

    for (def nm in nodeModuleDirs) {
        def plain = new File(nm, 'expo')
        if (plain.exists()) return plain

        def pnpm = new File(nm, '.pnpm')
        if (pnpm.exists()) {
            pnpm.eachDir { d ->
                def candidate = new File(d, 'node_modules/expo')
                if (candidate.exists()) {
                    return candidate
                }
            }
        }
    }

    return null
}

def expoDir = findExpoDir()
if (expoDir != null) {
    apply from: new File(expoDir, 'scripts/autolinking.gradle')
    useExpoModules()
}

def reactNativeShareDir = new File(rootProject.projectDir, '../node_modules/react-native-share/android')
if (!reactNativeShareDir.exists()) {
    reactNativeShareDir = new File(rootProject.projectDir, '../../node_modules/react-native-share/android')
}

include ':react-native-share'
project(':react-native-share').projectDir = reactNativeShareDir
